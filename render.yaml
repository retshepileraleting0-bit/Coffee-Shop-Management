services:
  - type: web
    name: coffee-shop-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: STAFF_PASSWORD
        value: barista2024
      - key: FRONTEND_URL
        value: "*"
